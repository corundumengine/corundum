name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**/*.md']
  pull_request:
    paths-ignore: ['**.md', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      # brew's auto-update costs every run a full `brew update`; the runner
      # image's formula snapshot is at most about a week old, and the ccache key
      # below reads whichever clang version actually gets installed.
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install llvm ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja --no-progress -y

      # clang links with link.exe and needs the SDK/MSVC environment, not just
      # headers, so this must run after the LLVM install.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Only the packages the build needs: llvm.sh would also install lldb and
      # clangd and run a second apt-get update, and xorg-dev pulls the whole
      # X.Org development set when GLFW needs six X11 libraries. Removing
      # man-db's auto-update flag skips its index rebuild after the install.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 clang-format-21 libc++-21-dev libc++abi-21-dev ninja-build libasound2-dev libgl-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev

      # The presets require CMake 4.3 and the runner images lag behind it. This
      # runs last among the toolchain steps so Visual Studio's bundled
      # CMake/Ninja cannot shadow the 4.3 install on PATH.
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=4.3'

      # No hardcoded LLVM version: brew/choco install unpinned packages, so read
      # the clang the toolchain file will actually select (the same install
      # ResolveLLVMPrefix.cmake picks on each OS) and key the cache off it.
      - name: Detect LLVM major
        id: llvm
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) clang_bin="$(brew --prefix llvm)/bin/clang" ;;
            Windows) clang_bin="/c/Program Files/LLVM/bin/clang.exe" ;;
            Linux) clang_bin="/usr/lib/llvm-21/bin/clang" ;;
          esac
          major="$("$clang_bin" --version | sed -n 's/.*version \([0-9]*\)\..*/\1/p' | head -n1)"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-llvm${{ steps.llvm.outputs.major }}-ccache
          restore-keys: ${{ runner.os }}-
          max-size: 300M

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset build

      - name: Test
        run: ctest --preset test -j 4

      - name: Prune old ccache caches
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh cache list \
            --key "ccache-${{ runner.os }}-" \
            --ref "${{ github.ref }}" \
            --sort created_at --order desc --limit 100 \
            --json id --jq '.[1:][].id')
          if [ -n "$ids" ]; then
            echo "$ids" | xargs -n1 gh cache delete
          fi
