name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja --no-progress -y

      # clang links with link.exe and needs the SDK/MSVC environment, not just
      # headers, so this must run after the LLVM install.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 lld-21 libc++-21-dev libc++abi-21-dev ninja-build libasound2-dev libgl-dev xorg-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev

      # The presets require CMake 4.3 and the runner images lag behind it. This
      # runs last among the toolchain steps so Visual Studio's bundled
      # CMake/Ninja cannot shadow the 4.3 install on PATH.
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '>=4.3'

      # No hardcoded LLVM version: brew/choco install unpinned packages, so read
      # the clang the toolchain file will actually select (the same install
      # ResolveLLVMPrefix.cmake picks on each OS) and key the cache off it.
      - name: Detect LLVM major
        id: llvm
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) clang_bin="$(brew --prefix llvm)/bin/clang" ;;
            Windows) clang_bin="/c/Program Files/LLVM/bin/clang.exe" ;;
            Linux) clang_bin="/usr/lib/llvm-21/bin/clang" ;;
          esac
          major="$("$clang_bin" --version | sed -n 's/.*version \([0-9]*\)\..*/\1/p' | head -n1)"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-llvm${{ steps.llvm.outputs.major }}-ccache
          restore-keys: ${{ runner.os }}-

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset build

      - name: Test
        run: ctest --preset test
